<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Tareas_Pro</title>
</head>
<body class="h-screen overflow-hidden bg-slate-900 text-white font-[Inter] flex items-center justify-center p-4">

  <div class="w-full max-w-6xl h-full max-h-[95vh] bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-6 shadow-2xl flex flex-col">

    <div class="relative flex items-center justify-center mb-6">

 
  <div class="text-center">
    <h1 class="text-5xl font-extrabold text-orange-200 tracking-wide">
      Tareas_Pro
    </h1>
    <p class="text-slate-400 mt-2 text-sm">
      Smart Task Finder • Búsqueda inteligente de tareas
    </p>
  </div>

  <div class="absolute right-0 bg-cyan-500/10 border border-cyan-400/20 px-5 py-3 rounded-2xl text-cyan-300 text-sm">
    SmartTask Finder
  </div>

</div>

    <div class="grid md:grid-cols-3 gap-4 mb-6">

      <input
        type="text"
        id="searchInput"
        placeholder="Rechercher une tâche..."
        class="md:col-span-2 bg-slate-900 border border-white/10 rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-cyan-400 placeholder:text-slate-500"
      >

      <button
        onclick="chercherTache()"
        class="bg-cyan-500 hover:bg-cyan-400 transition rounded-2xl font-semibold py-4 shadow-lg shadow-cyan-500/20"
      >
        Rechercher
      </button>

    </div>

    <div id="tasksContainer" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4 mb-6 flex-1 overflow-auto"></div>

    <div class="grid md:grid-cols-3 gap-4">

      <div class="bg-cyan-500/10 border border-cyan-400/20 rounded-2xl p-6">
        <h2 class="text-2xl font-bold text-cyan-300 mb-4">find()</h2>
        <div id="findResult"></div>
      </div>

      <div class="bg-emerald-500/10 border border-emerald-400/20 rounded-2xl p-6">
        <h2 class="text-2xl font-bold text-emerald-300 mb-4">filter()</h2>
        <div id="filterResult" class="space-y-3"></div>
      </div>

      <div class="bg-pink-500/10 border border-pink-400/20 rounded-2xl p-6">
        <h2 class="text-2xl font-bold text-pink-300 mb-4">findIndex()</h2>
        <div id="indexResult"></div>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
